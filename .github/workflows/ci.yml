name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '20'

jobs:
  lint-and-types:
    name: Lint & TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: TypeScript validation
        working-directory: frontend
        run: npx tsc --noEmit

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: lint-and-types
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Vitest
        working-directory: frontend
        run: npm test

      - name: Frontend coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: lint-and-types
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: innovasphere_test
          MYSQL_USER: e2e
          MYSQL_PASSWORD: e2e-pass
          MYSQL_ROOT_PASSWORD: e2e-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ue2e -pe2e-pass --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Run backend tests
        working-directory: backend-spring
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: innovasphere_test
          DB_USERNAME: e2e
          DB_PASSWORD: e2e-pass
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'aW5ub3Zhc3BoZXJlLWUyZS1zZWNyZXQta2V5LTAwMTIzNDU2Nzg5YWJjZGVmMDEyMzQ1Njc4OQ==' }}
          JWT_EXPIRATION: 3600000
          SEED_ENABLED: false
          SPRING_PROFILES_ACTIVE: test
        run: ./mvnw test

      - name: Backend coverage (JaCoCo)
        working-directory: backend-spring
        run: ./mvnw verify -Dtest='!RealBackendIntegrationTest'

      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend-spring/target/site/jacoco/
          retention-days: 7

  database-ci:
    name: Database & Flyway CI
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: innovasphere_flyway
          MYSQL_USER: e2e
          MYSQL_PASSWORD: e2e-pass
          MYSQL_ROOT_PASSWORD: e2e-root
        ports:
          - 3307:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ue2e -pe2e-pass --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Validate Flyway migrations
        working-directory: backend-spring
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3307
          DB_NAME: innovasphere_flyway
          DB_USERNAME: e2e
          DB_PASSWORD: e2e-pass
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'aW5ub3Zhc3BoZXJlLWUyZS1zZWNyZXQta2V5LTAwMTIzNDU2Nzg5YWJjZGVmMDEyMzQ1Njc4OQ==' }}
          SPRING_PROFILES_ACTIVE: test
        run: |
          ./mvnw flyway:info
          ./mvnw flyway:validate

  real-integration:
    name: Real Backend Integration
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: innovasphere_e2e
          MYSQL_USER: e2e
          MYSQL_PASSWORD: e2e-pass
          MYSQL_ROOT_PASSWORD: e2e-root
        ports:
          - 3308:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ue2e -pe2e-pass --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Run real integration tests
        working-directory: backend-spring
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3308
          DB_NAME: innovasphere_e2e
          DB_USERNAME: e2e
          DB_PASSWORD: e2e-pass
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'aW5ub3Zhc3BoZXJlLWUyZS1zZWNyZXQta2V5LTAwMTIzNDU2Nzg5YWJjZGVmMDEyMzQ1Njc4OQ==' }}
          JWT_EXPIRATION: 3600000
          SEED_ENABLED: false
          SPRING_PROFILES_ACTIVE: test
        run: ./mvnw test -Dtest=RealBackendIntegrationTest

  playwright-real-backend:
    name: Playwright Real-Backend E2E
    runs-on: ubuntu-latest
    needs: real-integration
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: innovasphere_e2e
          MYSQL_USER: e2e
          MYSQL_PASSWORD: e2e-pass
          MYSQL_ROOT_PASSWORD: e2e-root
        ports:
          - 3309:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ue2e -pe2e-pass --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Build frontend (real API URL)
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:8099
        run: npm run build

      - name: Start Spring Boot backend
        working-directory: backend-spring
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3309
          DB_NAME: innovasphere_e2e
          DB_USERNAME: e2e
          DB_PASSWORD: e2e-pass
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'aW5ub3Zhc3BoZXJlLWUyZS1zZWNyZXQta2V5LTAwMTIzNDU2Nzg5YWJjZGVmMDEyMzQ1Njc4OQ==' }}
          JWT_EXPIRATION: 3600000
          SEED_ENABLED: false
          PORT: 8099
          SPRING_PROFILES_ACTIVE: test
        run: ./mvnw spring-boot:run &
        timeout-minutes: 5

      - name: Wait for backend health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8099/api/health > /dev/null 2>&1; then
              echo "Backend is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become healthy"
          exit 1

      - name: Run Playwright mocked browser QA
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:8099
        run: npx playwright test
