# Innovasphere Backend — Render (Blueprint) configuration.
#
# Deploys as a Docker service using ./Dockerfile (multi-stage build, Java 21 JRE,
# non-root user, /healthz healthcheck). No native Java build on Render's side.
#
# Required environment variables (set in the Render dashboard):
#   APP_CORS_ALLOWED_ORIGINS  Comma-separated CORS origins
#   SPRING_DATASOURCE_URL      Full JDBC URL, e.g. jdbc:mysql://host:3306/innovasphere?...
#   SPRING_DATASOURCE_USERNAME Database user
#   SPRING_DATASOURCE_PASSWORD Database password (secret)
#   JWT_SECRET                Strong base64 secret >= 32 bytes — openssl rand -base64 48
#   JWT_EXPIRATION            Token lifetime in ms (default 604800000)
#   PORT                      Injected automatically by Render
#   SPRING_PROFILES_ACTIVE    Must be "prod"

services:
  - type: web
    name: innovasphere-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /healthz
    envVars:
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION
        value: "604800000"
        sync: false
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: "10000"
