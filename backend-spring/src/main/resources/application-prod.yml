# Production Configuration - Innovasphere v1.1
#
# Every value is supplied through the environment (Render dashboard / render.yaml).
# Nothing secret is hardcoded in this file.
#
# The datasource accepts the standard Spring names first and falls back to the
# DB_* pair, so either variable convention works without editing this file.

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:innovasphere}?createDatabaseIfNotExist=true&useSSL=true&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: InnovasphereHikariPool

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    defer-datasource-initialization: true

  jackson:
    serialization:
      write-dates-as-timestamps: false

  main:
    lazy-initialization: true

server:
  port: ${PORT:10000}
  address: 0.0.0.0
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,application/javascript,text/javascript,text/html,text/css,text/plain,image/svg+xml
    min-response-size: 1024

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION:604800000}

  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://innovasphere-4mmu.onrender.com,https://innovasphere-frontend.onrender.com}

  seed:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
    org.springframework.data.web.PageModule$WarningLoggingModifier: ERROR
