# Test profile: runs the suite against an embedded H2 database in MySQL
# compatibility mode so the shared development database is never used and no
# external MySQL server is required. The dialect is auto-detected from the
# JDBC URL (H2Dialect) - never set `database-platform` / `hibernate.dialect`
# explicitly, otherwise Hibernate logs HHH90000025.
spring:
  datasource:
    url: jdbc:h2:mem:innovasphere_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  sql:
    init:
      mode: always

  devtools:
    restart:
      enabled: false

app:
  jwt:
    secret: aW5ub3Zhc3BoZXJlLXRlc3Qtc2VjcmV0LWtleS0wMDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3OA==
    expiration-ms: 3600000
  seed:
    enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    org.hibernate.SQL: WARN
    org.hibernate.orm.deprecation: ERROR
    org.hibernate.orm.jdbc.bind: OFF
    org.springframework.data.web.PageModule$WarningLoggingModifier: ERROR
